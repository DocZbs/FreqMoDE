_target_: experiments.flow_matching.models.flow_agent.FlowMatchingAgent
_recursive_: false
multistep: ${multistep}
use_lr_scheduler: True
entropy_gamma: 0.0
router_z_delta: 0.00
use_proprio: False
seed: ${seed}

# Flow Matching specific parameters
flow_type: 'conditional'  # Options: 'conditional', 'rectified'
sampling_method: 'euler'  # Options: 'euler', 'heun', 'rk4', 'midpoint'
use_ot_flow: True  # Use Optimal Transport flow paths
num_sampling_steps: 10
sigma_min: 0.001  # Same as MoDE original
sigma_max: 80.0   # Same as MoDE original
noise_schedule: 'exponential'  # Options: 'constant', 'exponential', 'linear'

# Model architecture (same as diffusion)
ckpt_path: '/path/to/pretrained_weights/'
start_from_pretrained: False
use_text_not_embedding: True
act_window_size: ${act_seq_len}
latent_dim: 1024
obs_enc_dim: ${obs_dim}
cond_dim: 512
resnet_type: '50'

optimizer:
  _target_: torch.optim.AdamW
  transformer_weight_decay: 0.05
  obs_encoder_weight_decay: 0.05
  learning_rate: 1e-4
  betas: [0.9, 0.95]

lr_scheduler:
  lr_scheduler:
    init_lr: 1e-4
    init_lr_scale: 0.1
    final_lr_scale: 1e-6
    total_steps: 45000
    phase_ratio: "(0.02, 0.08, 0.9)"
    lr: 1e-4

model:
  _target_: experiments.flow_matching.models.flow_wrappers.FlowMatchingWrapper
  _recursive_: false

  flow_type: conditional  # Will be overridden by top-level flow_type
  sigma_min: 0.0001
  sigma_data: 0.5
  use_time_scaling: False  # Set to True to use EDM-style scaling

  inner_model:
    _target_: mode.models.networks.modedit.MoDeDiT
    action_dim: ${datamodule.action_space}
    goal_dim: ${model.cond_dim}
    obs_dim: 2048
    goal_conditioned: True
    causal: True
    use_custom_attn_mask: False
    use_proprio: ${model.use_proprio}
    state_dim: ${proprio_dims}
    embed_dim: ${model.latent_dim}
    n_layers: 12
    goal_seq_len: 1
    obs_seq_len: ${obs_seq_len}
    action_seq_len: ${act_seq_len}
    embed_pdrob: 0
    goal_drop: 0.1
    attn_pdrop: 0.3
    mlp_pdrop: 0.1
    n_heads: 8
    device: ${device}
    linear_output: True
    cond_router: True
    num_experts: 4
    top_k: 2
    router_normalize: True
    use_goal_in_routing: False
    use_argmax: False
    use_shared_expert: False
    use_noise_token_as_input: True
    init_style: 'olmoe'

language_goal:
  _target_: mode.models.networks.clip_lang_encoder.LangClip
  _recursive_: false
  model_name: ${clip_lang_model_name}
